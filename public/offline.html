<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Multimedia Club SMAN 1 Tamansari</title>
    <meta name="theme-color" content="#0d1117">
    <link rel="shortcut icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }
        .offline-card {
            background-color: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .btn-red {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            font-weight: 600;
        }
        .btn-red:hover {
            background-color: #b91c1c;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <img src="/assets/logo-mm-2023.png" alt="MMC Logo" style="height: 56px;" class="mb-4 bg-white p-1 rounded-3">
        
        <div class="mb-4">
            <i class="fa-solid fa-wifi-slash text-danger" style="font-size: 4rem;"></i>
        </div>

        <h3 class="fw-bold mb-2">Koneksi Terputus</h3>
        <p class="text-secondary small mb-4">Perangkat Anda sedang offline atau koneksi internet terhubung lambat. Silakan periksa jaringan Wi-Fi atau Data Anda.</p>

        <div class="d-grid gap-2">
            <button onclick="window.location.reload()" class="btn btn-red py-2">
                <i class="fa-solid fa-rotate-right me-1"></i> Coba Muat Ulang
            </button>
            <a href="/" class="btn btn-outline-light py-2">
                <i class="fa-solid fa-house me-1"></i> Beranda Utama
            </a>
        </div>
    </div>

</body>
</html>
